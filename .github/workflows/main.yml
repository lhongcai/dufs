name: 编译dufs

on:
#每天北京时间11点自动检测更新
  schedule:
   - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: '指定编译的版本号'
        required: false
        default: ''
      info:
        description: '发布Release的补充说明'
        required: false
        default: ''
      bj:
        description: '强制使用手动编译'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  actions: write
env:
  TZ: Asia/Shanghai
  CARGO_TERM_COLOR: always
  BJ: ${{ github.event.inputs.bj }}
  BRANCH: ${{ github.event.inputs.branch }}

jobs:
  check:
   runs-on: ubuntu-latest
   outputs:
     ver: ${{ steps.getversion.outputs.ver }}
     tag: ${{ steps.getversion.outputs.tag }}
   steps:
   - name: 检查更新
     id: getversion
     run: |
      ver=`curl https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest | jq -r '.tag_name'`
      tag=`curl https://api.github.com/repos/sigoden/dufs/releases/latest | jq -r '.tag_name'`
      echo "ver=${ver}" >> $GITHUB_OUTPUT
      echo "tag=${tag}" >> $GITHUB_OUTPUT
   -  name: 删除工作流
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 0
        keep_minimum_runs: 0
  build-assets:
    needs: check
    if: ${{ github.event.inputs.bj == 'true' || (github.event.inputs.bj != 'true' && needs.check.outputs.ver != needs.check.outputs.tag) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: TransparentLC/dufs-material-assets
          ref: master
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: latest
          check-latest: true
          cache: pnpm
          cache-dependency-path: "**/package.json"
      - name: Build assets
        run: |
          pnpm install
          DUFS_EMBED_FILENAME=1 pnpm run build
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: dufs-自定义页面
          path: dist

  
  build-dufs:
    needs: 
     - build-assets
     - check
    strategy:
      fail-fast: false
      matrix:
        include:
        
        - target: aarch64-apple-darwin
          os: macos-latest
          NAME: dufs-aarch64-apple-darwin
          
        - target: aarch64-pc-windows-msvc
          os: windows-latest
          NAME: dufs-aarch64-pc-windows-msvc.exe
          
        - target: x86_64-apple-darwin
          os: macos-latest
          NAME: dufs-x86_64-apple-darwin
          
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          NAME: dufs-x86_64-pc-windows-msvc.exe
          
        - target: i686-pc-windows-msvc
          os: windows-latest
          NAME: dufs-i686-pc-windows-msvc.exe
          
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
          NAME: dufs-aarch64-linux-musl
          
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
          NAME: dufs-x86_64-linux-musl
            
        - target: i686-unknown-linux-musl
          os: ubuntu-latest
          NAME: dufs-i686-linux-musl
        
        - target: armv7-unknown-linux-musleabihf
          os: ubuntu-latest
          NAME: dufs-armv7-linux-musleabihf

        - target: armv7-unknown-linux-musleabi
          os: ubuntu-latest
          NAME: dufs-armv7-linux-musleabi
          
        - target: arm-unknown-linux-musleabihf
          os: ubuntu-latest
          NAME: dufs-arm-linux-musleabihf

        - target: arm-unknown-linux-musleabi
          os: ubuntu-latest
          NAME: dufs-arm-linux-musleabi

        - target: mipsel-unknown-linux-musl
          os: ubuntu-latest
          NAME: dufs-mipsel-linux-muslsf

        - target: mips-unknown-linux-musl
          os: ubuntu-latest
          NAME: dufs-mips-linux-muslsf

        - target: x86_64-unknown-freebsd
          os: ubuntu-latest
          NAME: dufs-x86_64-freebsd
            
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.NAME }}
    outputs:
      TAG: ${{ steps.set-tag.outputs.TAG }}
    steps:
      - name: 确定版本号
        id: set-tag
        shell: bash
        run: |
          if [[ "${{ env.BJ }}" == "true" ]]; then
            echo "强制进行编译..."
            if [[ -n "${{ github.event.inputs.branch }}" ]]; then
                echo "使用手动指定的版本：${{ github.event.inputs.branch }}"
                TAG=${{ github.event.inputs.branch }}
                echo "TAG=$TAG" >> $GITHUB_ENV
            else
                echo "使用自动获取的版本：${{ needs.check.outputs.tag }}"
                TAG=${{ needs.check.outputs.tag }}
                echo "TAG=$TAG" >> $GITHUB_ENV
            fi
          else
            echo "使用自动获取的版本：${{ needs.check.outputs.tag }}"
            TAG=${{ needs.check.outputs.tag }}
            echo "TAG=$TAG" >> $GITHUB_ENV
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT 
          
      - uses: actions/checkout@v5
        with:
          repository: sigoden/dufs
          ref: ${{ env.TAG }}
          
      - name: 下载apple-windows工具链
        if: ${{ matrix.TARGET == 'aarch64-apple-darwin' || matrix.TARGET == 'aarch64-pc-windows-msvc' || matrix.TARGET == 'x86_64-apple-darwin' || matrix.TARGET == 'x86_64-pc-windows-msvc' || matrix.TARGET == 'i686-pc-windows-msvc' || matrix.TARGET == 'x86_64-unknown-freebsd' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: 下载apple-windows编译工具
        if: ${{ matrix.TARGET == 'aarch64-apple-darwin' || matrix.TARGET == 'aarch64-pc-windows-msvc' || matrix.TARGET == 'i686-pc-windows-msvc' || matrix.TARGET == 'x86_64-unknown-freebsd' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: 下载linux编译工具
        if: ${{ matrix.TARGET != 'aarch64-apple-darwin' && matrix.TARGET != 'aarch64-pc-windows-msvc' && matrix.TARGET != 'x86_64-apple-darwin' && matrix.TARGET != 'x86_64-pc-windows-msvc' && matrix.TARGET != 'i686-pc-windows-msvc' && matrix.TARGET != 'x86_64-unknown-freebsd' }}
        shell: bash
        run: |
          # 工具链来源：https://github.com/cross-tools/musl-cross/releases
          TOOLCHAIN_RELEASE="20261001"
          # Rust 的 mips/mipsel musl 目标是软浮点（+soft-float），需使用对应的 muslsf 工具链
          TOOLCHAIN_NAME="$TARGET"
          if [[ "$TARGET" == "mips-unknown-linux-musl" ]]; then
            TOOLCHAIN_NAME="mips-unknown-linux-muslsf"
          elif [[ "$TARGET" == "mipsel-unknown-linux-musl" ]]; then
            TOOLCHAIN_NAME="mipsel-unknown-linux-muslsf"
          fi

          TOOLCHAIN_DIR="/opt/x-tools/$TOOLCHAIN_NAME"
          TOOLCHAIN_URL="https://github.com/cross-tools/musl-cross/releases/download/$TOOLCHAIN_RELEASE/$TOOLCHAIN_NAME.tar.xz"
          echo "下载 $TOOLCHAIN_URL"
          mkdir -p /opt/musl_gcc
          curl -fsSL --retry 3 -o "/opt/musl_gcc/$TOOLCHAIN_NAME.tar.xz" "$TOOLCHAIN_URL"
          sudo mkdir -p /opt/x-tools
          sudo tar -xJf "/opt/musl_gcc/$TOOLCHAIN_NAME.tar.xz" -C /opt/x-tools
          if [[ ! -x "$TOOLCHAIN_DIR/bin/$TOOLCHAIN_NAME-gcc" ]]; then
            echo "工具链解压失败：$TOOLCHAIN_DIR/bin/$TOOLCHAIN_NAME-gcc 不存在"
            exit 1
          fi
          # 加入 PATH，供构建脚本（cc crate）按 <target>-gcc 查找编译器
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          rustup set auto-self-update disable
          if [[ $TARGET =~ ^mips.*$ ]]; then
            # muslsf 工具链的编译器前缀与 Rust 目标三元组不同，显式告诉 cc crate 用哪个编译器
            cc_env="${TARGET//-/_}"
            echo "CC_${cc_env^^}=$TOOLCHAIN_DIR/bin/$TOOLCHAIN_NAME-gcc" >> "$GITHUB_ENV"
            echo "AR_${cc_env^^}=$TOOLCHAIN_DIR/bin/$TOOLCHAIN_NAME-ar" >> "$GITHUB_ENV"

            rustup toolchain install nightly-2026-02-02
            rustup component add rust-src --toolchain nightly-2026-02-02
            # https://github.com/rust-lang/rust/issues/128808
            # remove it after Cargo or rustc fix this.
            RUST_LIB_SRC=$HOME/.rustup/toolchains/nightly-2026-02-02-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/
            if [[ -f $RUST_LIB_SRC/library/Cargo.lock && ! -f $RUST_LIB_SRC/Cargo.lock ]]; then
              cp -f $RUST_LIB_SRC/library/Cargo.lock $RUST_LIB_SRC/Cargo.lock
            fi
          else
            rustup target add "$TARGET"
          fi

          # 自动定位 sysroot 的 crt 目录和 gcc 的 libgcc 目录（不同目标布局可能不同，用 find 兜底）
          SYSROOT_LIB_DIR=$(sudo find "$TOOLCHAIN_DIR" -type f -name crti.o -print -quit 2>/dev/null | xargs -r dirname)
          GCC_LIB_DIR=$(sudo find "$TOOLCHAIN_DIR" -type f -name libgcc.a -print -quit 2>/dev/null | xargs -r dirname)
          echo "SYSROOT_LIB_DIR=$SYSROOT_LIB_DIR"
          echo "GCC_LIB_DIR=$GCC_LIB_DIR"

          # 构造 rustflags：crt-static + 显式 -L 路径，避免链接器找不到 crti.o / libgcc.a
          RUSTFLAGS='["-C", "target-feature=+crt-static"'
          if [[ -n "$SYSROOT_LIB_DIR" ]]; then
            RUSTFLAGS+=", \"-L\", \"$SYSROOT_LIB_DIR\""
          fi
          if [[ -n "$GCC_LIB_DIR" ]]; then
            RUSTFLAGS+=", \"-L\", \"$GCC_LIB_DIR\""
          fi
          if [[ $TARGET =~ ^mips.*$ ]]; then
            RUSTFLAGS+=", \"-l\", \"atomic\", \"-l\", \"gcc\""
          fi
          RUSTFLAGS+=']'

          cat >>"$HOME/.cargo/config" <<EOF
          [target.$TARGET]
          linker = "$TOOLCHAIN_DIR/bin/$TOOLCHAIN_NAME-gcc"
          rustflags = $RUSTFLAGS
          EOF
      - name: 打印版本信息 (Rust, cargo, GCC)
        shell: bash
        run: |
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V
      - name: 下载 assets 页面
        uses: actions/download-artifact@v4
        with:
          name: dufs-自定义页面
          path: dufs-material-assets-embed
      - name: 编译dufs
        shell: bash
        run: |
          echo "开始修改 Cargo.toml 写入 thunk-rs 以支持win7..."
          printf '\n[target.x86_64-pc-windows-msvc.build-dependencies]\nthunk-rs = { version = "0.3.3", features = ["win7"] }\n\n[target.i686-pc-windows-msvc.build-dependencies]\nthunk-rs = { version = "0.3.3", features = ["win7"] }\n\n[target.aarch64-pc-windows-msvc.build-dependencies]\nthunk-rs = { version = "0.3.3", features = ["win7"] }\n' >> Cargo.toml
          echo "创建 build.rs 文件..."
          printf '// 配置 thunk-rs 来链接 Windows 7 兼容库，并自动设置链接参数\n#[cfg(target_os = "windows")]\nfn main() {\n    if !std::env::var("TARGET").unwrap_or_default().contains("aarch64") {\n        thunk::thunk();\n    }\n}\n\n#[cfg(not(target_os = "windows"))]\nfn main() {}\n' > build.rs
            
          if [[ $TARGET == 'aarch64-apple-darwin' || $TARGET == 'aarch64-pc-windows-msvc' || $TARGET == 'i686-pc-windows-msvc' || $TARGET == 'x86_64-unknown-freebsd' ]]; then
            echo "编译： cross build --locked --release --target=${{ matrix.target }}"
            cross build --release --target=${{ matrix.target }}
          else
            echo "编译： cargo build --locked --release --target=${{ matrix.target }}"
            if [[ $TARGET =~ ^mips.*$ ]]; then
              cargo +nightly-2026-02-02 build --release --target=${{ matrix.target }} -Z build-std=std,panic_abort
            else
              cargo build --release --target=${{ matrix.target }}
            fi
          fi
            
          cd target/${{ matrix.target }}/release
          mkdir -p ./out
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv ./dufs.exe ./out/${{ matrix.NAME }}
          else
            mv ./dufs ./out/${{ matrix.NAME }}
          fi
          
          ls -alh ./out/
          echo "build_time=$(TZ=UTC-8 date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
      - name: 安装 UPX
        if: ${{ matrix.TARGET != 'aarch64-apple-darwin' && matrix.TARGET != 'aarch64-pc-windows-msvc' && matrix.TARGET != 'x86_64-apple-darwin' && matrix.TARGET != 'x86_64-pc-windows-msvc' && matrix.TARGET != 'i686-pc-windows-msvc' && matrix.TARGET != 'x86_64-unknown-freebsd' }}
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.2.4
          install-only: true
      - name: 压缩程序
        if: ${{ matrix.TARGET != 'aarch64-apple-darwin' && matrix.TARGET != 'aarch64-pc-windows-msvc' && matrix.TARGET != 'x86_64-apple-darwin' && matrix.TARGET != 'x86_64-pc-windows-msvc' && matrix.TARGET != 'i686-pc-windows-msvc' && matrix.TARGET != 'x86_64-unknown-freebsd' }}
        run: |
          cd target/${{ matrix.target }}/release/out
          cp ${{ matrix.NAME }} ${{ matrix.NAME }}-upx
          upx --lzma --best ${{ matrix.NAME }}-upx
      - name: 上传程序
        uses: actions/upload-artifact@v4
        with:
          name: dufs-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/out/*

  release:
    needs: build-dufs
    env:
      TAG: ${{ needs.build-dufs.outputs.TAG }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 下载已上传的文件
        uses: actions/download-artifact@v4
        with:
         path: dufs_files

      - name: 设置构建时间
        run: |
         mkdir -p release
         sudo timedatectl set-timezone "Asia/Shanghai"
         # 遍历下载的每个 artifact 子文件夹，把里面的二进制移动到 release/
         for dir in dufs_files/*; do
          if [ -d "$dir" ]; then
           mv "$dir"/* release/
          fi
         done
         echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
            token: ${{ github.token }}
            body: |
             > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.TAG }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github) 

              **-upx** 后缀的 为upx压缩文件
              
              **[官方更新说明](https://github.com/sigoden/dufs/releases)**

              ${{ github.event.inputs.info }}
              
            tag_name: ${{ env.TAG }}
            files: release/*
  keepalive-workflow:
    # github超过60天未提交将自动停止工作流
    name: 工作流保活 
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      #- uses: gautamkrishnar/keepalive-workflow@v2
        #with:
          #use_api: true
      - name: 检查上次提交日期
        id: check_commit_date
        run: |
          # 获取上次提交日期（格式：YYYY-MM-DD）
          LAST_COMMIT_DATE=$(git log -1 --format=%cd --date=short)
          echo "上次提交日期: $LAST_COMMIT_DATE"
          # 计算当前日期和上次提交日期的差值（单位：天）
          LAST_COMMIT_TIMESTAMP=$(date -d "$LAST_COMMIT_DATE" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          DIFF_DAYS=$(( (CURRENT_TIMESTAMP - LAST_COMMIT_TIMESTAMP) / 86400 ))
          echo "距离上次提交以来的天数: $DIFF_DAYS"
          echo "diff_days=$DIFF_DAYS" >> $GITHUB_ENV
      - name: 执行空提交
        if: ${{ env.diff_days > 50 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 创建空提交
          git commit --allow-empty -m "自动空提交，保持仓库活跃"
          git push
